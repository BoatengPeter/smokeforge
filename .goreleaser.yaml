version: 2

project_name: smokeforge

before:
  hooks:
    - go test ./...
    - go test -tags=integration ./...

builds:
  - id: smokeforge
    main: ./cmd/smokeforge
    binary: smokeforge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/BoatengPeter/smokeforge/internal/version.Version={{.Version}}
      - -X github.com/BoatengPeter/smokeforge/internal/version.Commit={{.Commit}}
      - -X github.com/BoatengPeter/smokeforge/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: BoatengPeter
    name: smokeforge
  draft: true
  prerelease: auto
  name_template: "smokeforge {{.Version}}"

